onboarding = false
[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
panel_bg = "reset"
accent = "#f6c177"

[ui]
pane_gaps = false
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = true

status_indicators = "symbols"
[keys]
prefix = "ctrl+b"

# Cycling lives on [ and ], all on cmd: Super has no legacy encoding, so these
# never collapse into C0 bytes the way ctrl+alt+h/j/[ do (== backspace/enter/esc).
#   cmd+[ ]              agents
#   cmd+shift+[ ]        workspaces
#   cmd+ctrl+[ ]         tabs      (needs the goto_split unbind in ghostty/config)
#   cmd+alt+[ ]          panes     (needs a Hyprland unbind on Omarchy)
# Avoid: cmd+1..9 (Hyprland), plain ctrl+alt+<letter> (C0 collisions).
# cmd+alt+[ ] is Hyprland's by default on Omarchy; unbind it there (ticket 15).
# Verify any new chord against:
#   hyprctl binds  |  ghostty +list-keybinds --default
focus_pane_left = ["prefix+h", "cmd+alt+h"]
focus_pane_down = ["prefix+j", "cmd+alt+j"]
# No direct chord: cmd+alt+k is Hyprland's (omarchy tmux keybindings menu)
focus_pane_up = "prefix+k"
focus_pane_right = ["prefix+l", "cmd+alt+l"]

previous_tab = ["prefix+p", "cmd+ctrl+["]
next_tab = ["prefix+n", "cmd+ctrl+]"]

zoom = ["prefix+z", "cmd+alt+backslash"]

cycle_pane_previous = "cmd+alt+["
cycle_pane_next = "cmd+alt+]"

previous_agent = ["prefix+comma", "cmd+["]
next_agent = ["prefix+period", "cmd+]"]
focus_agent = "prefix+alt+1..9"

previous_workspace = "cmd+shift+["
next_workspace = "cmd+shift+]"

last_pane = ["cmd+alt+backtick"]

[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[[keys.command]]
key = "prefix+y"    # lazygit popup (g/shift+g are goto & new_worktree defaults)
type = "pane"
command = "lazygit"

[[keys.command]]
key = "prefix+u"              # hunk: review working-tree changes, auto-reloading
type = "pane"
command = "hunk diff --watch"

onboarding = false
[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
panel_bg = "reset"
accent = "#f6c177"

[ui]
pane_gaps = false
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = true

[keys]
prefix = "ctrl+b"
focus_pane_left = ["prefix+h", "cmd+alt+h"]
focus_pane_down = ["prefix+j", "cmd+alt+j"]
focus_pane_up = ["prefix+k", "cmd+alt+k"]
focus_pane_right = ["prefix+l", "cmd+alt+l"]

previous_tab = ["prefix+p", "cmd+alt+["]
next_tab = ["prefix+n", "cmd+alt+]"]

zoom = ["prefix+z", "cmd+alt+backslash"]

cycle_pane_previous = "ctrl+cmd+["
cycle_pane_next = "ctrl+cmd+]"

previous_agent = ["prefix+comma", "cmd+["]
next_agent = ["prefix+period", "cmd+]"]
focus_agent = "cmd+1..9"

previous_workspace = "cmd+shift+["
next_workspace = "cmd+shift+]"

last_pane = ["cmd+alt+backtick"]

[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[[keys.command]]
key = "prefix+y"    # lazygit popup (g/shift+g are goto & new_worktree defaults)
type = "pane"
command = "lazygit"

[[keys.command]]
key = "prefix+u"              # hunk: review working-tree changes, auto-reloading
type = "pane"
command = "hunk diff --watch"
